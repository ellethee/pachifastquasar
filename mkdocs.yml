# Single documentation site of the monorepo. The site root is the shell docs (docs_dir); settings, profile, admin and the
# other packages are included with mkdocs-monorepo-plugin. A package also builds alone:
# `mkdocs build -f packages/<name>/mkdocs.yml`.
site_name: Pachi Fast Quasar
repo_url: https://github.com/ellethee/pachifastquasar
repo_name: ilpachi/pachifastquasar
docs_dir: packages/pachifastquasar/docs
site_url: !ENV [DOCS_SITE_URL, "https://ellethee.github.io/pachifastquasar/"]

theme:
  name: material
  custom_dir: packages/pachifastquasar/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
  - monorepo
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Routing and menus: routing-and-menus.md
  - Authentication: authentication.md
  - Security: security.md
  - HTTP client: http-client.md
  - Internationalization: i18n.md
  - Theming and styles: theming-and-styles.md
  - Backend contract: backend-contract.md
  - Packages: packages.md
  - fastquasar-settings: '!include ./packages/fastquasar-settings/mkdocs.yml'
  - fastquasar-profile: '!include ./packages/fastquasar-profile/mkdocs.yml'
  - fastquasar-admin: '!include ./packages/fastquasar-admin/mkdocs.yml'
  - pachi-i18n: '!include ./packages/pachi-i18n/mkdocs.yml'
  - pachi-kit: '!include ./packages/pachi-kit/mkdocs.yml'
  - fastquasar-dashboard-widgets: '!include ./packages/fastquasar-dashboard-widgets/mkdocs.yml'
  - pachifq: '!include ./packages/pachifq/mkdocs.yml'

exclude_docs: |
  history/
  pachi-kit/history/
  pachi-i18n/history/
  pachifq/history/
  fastquasar-settings/history/
  fastquasar-profile/history/
  fastquasar-admin/history/
  fastquasar-dashboard-widgets/history/
