site_name: pachi-i18n
site_description: "i18n for Vue 3 / Quasar apps on vue-i18n 11, with language detection, per-package messages and a language switcher."
repo_url: https://github.com/ellethee/pachifastquasar
repo_name: ilpachi/pachifastquasar
site_url: !ENV [DOCS_SITE_URL, ""]
docs_dir: docs
theme:
  name: material
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - API reference: reference.md
  - Messages and locales: messages-and-locales.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md

exclude_docs: |
  history/
