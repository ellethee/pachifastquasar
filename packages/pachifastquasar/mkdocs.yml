site_name: Pachi Fast Quasar
site_description: Vue 3 / Quasar application shell as an npm package (@ilpachi/pachifastquasar)
repo_url: https://github.com/ellethee/pachifastquasar
repo_name: ilpachi/pachifastquasar
docs_dir: docs
site_url: !ENV [DOCS_SITE_URL, ""]

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Routing and menus: routing-and-menus.md
  - Authentication: authentication.md
  - HTTP client: http-client.md
  - Internationalization: i18n.md
  - Theming and styles: theming-and-styles.md
  - Backend contract: backend-contract.md
  - Packages: packages.md

exclude_docs: |
  history/
