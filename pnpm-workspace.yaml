# Monorepo @ilpachi: i package vivono in packages/*, l'app di prova in playground/.
# Tra package del workspace si usa `workspace:*` (pnpm lo riscrive nella versione reale in pack/publish).
# Tutti i package @ilpachi (tranne il deprecato httpachi) vivono in packages/*; sono pubblicati su npmjs (scope @ilpachi); `@ilpachi/use-alova` (esterno) si risolve da npmjs.
packages:
  - packages/*
  - playground
  - compat/smoke
  - e2e

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

shamefullyHoist: true

minimumReleaseAgeExclude:
  - '@ilpachi/*'


# Advisory noti e accettati (solo strumenti di build, nessun codice nei bundle pubblicati):
# - GHSA-vfj7-8cjw-p6xm: braces (fast-glob > micromatch, via @intlify/unplugin-vue-i18n), nessuna versione corretta
# - GHSA-g7r4-m6w7-qqqr: esbuild (vite-plugin-checker > vite), severità low, serve vite con esbuild >=0.28.1
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-g7r4-m6w7-qqqr

# vite-plugin-dts 5 (unplugin-dts) dichiara peer `@vue/language-core ^3`, ma i d.ts dei componenti .vue
# restano equivalenti a quelli di vite-plugin-dts 4 (language-core 2.2) solo con 2.2.x: per i consumatori con
# `exactOptionalPropertyTypes` quelli di language-core 3 cambiano forma (vedi CONTRIBUTING.md).
peerDependencyRules:
  allowedVersions:
    'unplugin-dts>@vue/language-core': '2'
