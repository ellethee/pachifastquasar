# E2E OPZIONALE: suite Playwright (e2e/) sul playground costruito, contro un backend pachifast reale (compat/backend).
# NON blocca nulla: parte solo a mano ("Run workflow") o una volta a settimana, e il job ha continue-on-error.
# Dettagli in e2e/README.md.
# NOTA: pachifast non e' ancora pubblicato su PyPI: finche' non lo e', questo job fallisce all'installazione
# del backend (e' atteso). Variabili opzionali del repository: PACHIFAST_INDEX_URL (indice PyPI alternativo,
# senza credenziali) e PACHIFAST_VERSION. Input manuale: pachifast_version (vuoto = ultima). Nessun segreto.
name: E2E playground

on:
  workflow_dispatch:
    inputs:
      pachifast_version:
        description: 'Versione di pachifast da PyPI (vuoto = ultima)'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  COMPAT_PORT: '8030'
  PACHIFAST_VERSION: ${{ inputs.pachifast_version || vars.PACHIFAST_VERSION }}
  # vuoto = PyPI (backend.sh usa PyPI se la variabile manca)
  PACHIFAST_INDEX_URL: ${{ vars.PACHIFAST_INDEX_URL }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # opzionale: un fallimento non rende rosso il resto della pipeline
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - name: Backend pachifast (installazione, database, avvio)
        run: |
          set -eu
          export COMPAT_DATA_DIR="${RUNNER_TEMP}/compat-data"
          compat/backend.sh all
          echo "COMPAT_DATA_DIR=${COMPAT_DATA_DIR}" >> "$GITHUB_ENV"
      - name: Versione di pachifast
        run: compat/backend.sh version
      - run: pnpm install --frozen-lockfile
      - name: Browser (Playwright Chromium e dipendenze di sistema)
        run: pnpm -C e2e exec playwright install --with-deps chromium
      - name: Build del playground (shell da dist)
        run: pnpm build:playground
      - name: E2E
        run: pnpm e2e
      - name: Report Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Log del backend (se fallisce)
        if: failure()
        run: tail -n 80 "${COMPAT_DATA_DIR}/backend.log" || true
      - name: Stop del backend
        if: always()
        run: compat/backend.sh stop || true
