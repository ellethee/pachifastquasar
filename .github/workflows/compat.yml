# Compat pachifast: OPTIONAL smoke test of the frontend packages (fastquasar-settings, fastquasar-admin, use-alova)
# against a real pachifast backend. It blocks nothing: it runs only manually ("Run workflow") or once a week,
# and the job has continue-on-error. Details in compat/README.md.
# NOTE: pachifast is not yet published on PyPI: until it is, this job fails when installing
# the backend (this is expected). Optional repository variables: PACHIFAST_INDEX_URL (alternative PyPI index,
# without credentials) and PACHIFAST_VERSION. Manual input: pachifast_version (empty = latest). No secrets.
name: Compat pachifast

on:
  workflow_dispatch:
    inputs:
      pachifast_version:
        description: 'pachifast version from PyPI (empty = latest)'
        required: false
        default: ''
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: false

env:
  COMPAT_PORT: '8030'
  PACHIFAST_VERSION: ${{ inputs.pachifast_version || vars.PACHIFAST_VERSION }}
  # empty = PyPI (backend.sh uses PyPI if the variable is missing)
  PACHIFAST_INDEX_URL: ${{ vars.PACHIFAST_INDEX_URL }}

jobs:
  compat:
    runs-on: ubuntu-latest
    # optional: a failure does not turn the rest of the pipeline red
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - name: Backend pachifast (installazione, database, avvio)
        run: |
          set -eu
          export COMPAT_DATA_DIR="${RUNNER_TEMP}/compat-data"
          compat/backend.sh all
          echo "COMPAT_DATA_DIR=${COMPAT_DATA_DIR}" >> "$GITHUB_ENV"
      - name: pachifast version
        run: compat/backend.sh version
      - run: pnpm install --frozen-lockfile
      - name: Build the involved packages
        run: pnpm --filter "ilpachi-compat-smoke..." --filter '!ilpachi-compat-smoke' build
      - name: Smoke
        run: pnpm -C compat/smoke smoke
      - name: Backend log (on failure)
        if: failure()
        run: tail -n 80 "${COMPAT_DATA_DIR}/backend.log" || true
      - name: Stop the backend
        if: always()
        run: compat/backend.sh stop || true
