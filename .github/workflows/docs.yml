# Builds the single site (MkDocs + mkdocs-monorepo-plugin, mkdocs.yml at the root) and publishes it on GitHub Pages
# (https://ellethee.github.io/pachifastquasar/). PRs only run the `--strict` build.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
    paths: ['packages/*/docs/**', 'packages/*/mkdocs.yml', 'packages/*/CHANGELOG.md', 'packages/*/overrides/**', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['packages/*/docs/**', 'packages/*/mkdocs.yml', 'packages/*/CHANGELOG.md', 'packages/*/overrides/**', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build the site
        run: uvx --with "mkdocs>=1.6,<2" --with mkdocs-material --with mkdocs-monorepo-plugin mkdocs build --strict
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
