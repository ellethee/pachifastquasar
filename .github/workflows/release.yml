# Per-package release: a tag `<name>@<version>` (e.g. fastquasar-profile@0.4.2) builds and publishes ONLY that package.
# The tag is created with `pnpm release <name> <patch|minor|major|x.y.z>` (scripts/release.mjs) and pushed with
# `git push --follow-tags`. Publishing uses `npm` (not pnpm) on the tarball created by `pnpm pack`, which rewrites `workspace:*`.
# Trusted publishing (OIDC) on npmjs: no token in the repository. One-time setup FOR EACH package on npmjs:
# Settings > Trusted publisher > GitHub Actions (repository ellethee/pachifastquasar, workflow release.yml).
# Requires npm >= 11.5.1. Publishing is skipped if the version already exists (safe to re-run).
# Manuale ("Run workflow"): publish-check = dry-run, without publishing.
name: Release

on:
  push:
    tags: ['*@*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name for the publish-check (e.g. fastquasar-profile)'
        required: true

permissions:
  contents: read
  id-token: write

# no cancellation: a half-done release must not be interrupted; different tags do not block each other
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: npm >= 11.5.1 (required by trusted publishing)
        run: |
          set -eu
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@latest
          fi
          npm --version
      - name: Package and version from the tag
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="$INPUT_PACKAGE"
          else
            NAME="${GITHUB_REF_NAME%@*}"
            VER_TAG="${GITHUB_REF_NAME##*@}"
          fi
          case "$NAME" in ""|*/*|*..*|.*) echo "Invalid package name: '$NAME'"; exit 1;; esac
          test -f "packages/$NAME/package.json" || { echo "packages/$NAME does not exist"; exit 1; }
          VER="$(node -p "require('./packages/$NAME/package.json').version")"
          if [ -n "${VER_TAG:-}" ] && [ "$VER_TAG" != "$VER" ]; then
            echo "The tag ($VER_TAG) does not match the version of packages/$NAME ($VER)"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Build and publish (skipped if the version already exists)
        env:
          NAME: ${{ steps.ref.outputs.name }}
          VER: ${{ steps.ref.outputs.version }}
          DRY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -eu
          PKG="$(node -p "require('./packages/$NAME/package.json').name")"
          if [ "$DRY" != "true" ]; then
            # only code that is on main is published (a tag pushed from an unreleased branch does not pass)
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "The tag commit is not contained in origin/main: release refused."; exit 1; }
            RC=0
            OUT="$(npm view "${PKG}@${VER}" version 2>&1)" || RC=$?
            if [ "$RC" -eq 0 ] && [ "$OUT" = "${VER}" ]; then
              echo "::warning::${PKG}@${VER} is already published: publishing skipped."
              exit 0
            fi
            # an error other than "version does not exist" (404) is a network error: do not proceed blindly
            if [ "$RC" -ne 0 ] && ! printf '%s' "$OUT" | grep -q "E404"; then
              echo "npm view failed (not 404): $OUT"; exit 1
            fi
          fi
          # install only the package and its workspace dependencies
          pnpm install --frozen-lockfile --filter "${PKG}..."
          # first build the workspace dependencies and the package (the types/dist of the others are needed by typecheck)
          pnpm --filter "${PKG}..." build
          pnpm --filter "./packages/$NAME" typecheck
          pnpm --filter "./packages/$NAME" --if-present test
          PACK_DIR="${RUNNER_TEMP}/pack"
          mkdir -p "$PACK_DIR"
          pnpm --filter "./packages/$NAME" pack --pack-destination "$PACK_DIR"
          TARBALL="$(ls "$PACK_DIR"/*.tgz)"
          # pre-releases (1.2.0-beta.1) go on the "next" dist-tag instead of "latest"
          case "$VER" in *-*) TAG_ARGS="--tag next" ;; *) TAG_ARGS="" ;; esac
          if [ "$DRY" = "true" ]; then
            npm publish "$TARBALL" --dry-run --ignore-scripts --access public ${TAG_ARGS}
          else
            npm publish "$TARBALL" --provenance --access public --ignore-scripts ${TAG_ARGS}
          fi
