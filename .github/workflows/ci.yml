# Typecheck + test + build + tarball check ONLY for the touched packages (and their dependents).
# The filter is computed by scripts/ci-filter.sh: base = target branch of the PR, or the previous commit of the push;
# if files outside packages/ and playground/ change (lockfile, workflows, scripts) everything is built.
# No secrets: the @ilpachi packages of the monorepo are workspace packages and use-alova comes from npmjs.
# Publishing is NOT done here: see release.yml (tag <name>@<version>).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the pnpm version is the one in `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Compute the filter
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$BEFORE_SHA"
          fi
          FILTER="$(scripts/ci-filter.sh "$BASE")"
          echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"
          echo "Filtro pnpm: ${FILTER}"
      - run: pnpm install --frozen-lockfile
      # informational: reports vulnerabilities of production dependencies without blocking CI
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --prod
      # build first (the dist of the other packages is needed by typecheck and test), then the packages (the playground uses the built ./quasar preset), the playground only if touched by the filter
      - run: pnpm --filter "${{ steps.filter.outputs.filter }}" --filter '!pachifastquasar-playground' --filter '!ilpachi-monorepo' --filter '!ilpachi-compat-smoke' build
      - run: pnpm --filter "${{ steps.filter.outputs.filter }}" --filter '!pachifastquasar-playground' --filter '!ilpachi-monorepo' --filter '!ilpachi-compat-smoke' typecheck
      - run: pnpm --filter "${{ steps.filter.outputs.filter }}" --filter '!pachifastquasar-playground' --filter '!ilpachi-monorepo' --filter '!ilpachi-compat-smoke' --if-present test
      - name: Tarball check
        run: pnpm --filter "${{ steps.filter.outputs.filter }}" --filter '!pachifastquasar-playground' --filter '!ilpachi-monorepo' --filter '!ilpachi-compat-smoke' exec npm pack --dry-run --ignore-scripts
      - name: Playground (typecheck + build with the package from dist/)
        run: |
          if [ "${{ steps.filter.outputs.filter }}" = '*' ] || pnpm --filter "${{ steps.filter.outputs.filter }}" ls --depth -1 --json | grep -q '"name": "pachifastquasar-playground"'; then
            QCLI_AUTH_ENABLED=false pnpm typecheck:playground
            QCLI_AUTH_ENABLED=false pnpm build:playground
          fi
