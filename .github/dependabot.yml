version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # pinned to 2.2.x: see CONTRIBUTING.md (.vue d.ts with vite-plugin-dts 5)
      - dependency-name: "@vue/language-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # follows the minimum supported Node (>=20): see CONTRIBUTING.md
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 11.2+ requires Node >= 22.13 (the shell supports Node >= 20): see CONTRIBUTING.md
      - dependency-name: "@intlify/unplugin-vue-i18n"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
